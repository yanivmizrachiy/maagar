name: Publish H8 Preview (manual)

# The H8 summer-work preview is a finished one-off deliverable. Rebuilding and
# committing it on every push/PR created bot commits ("[skip ci]") on main and
# on PR branches. Run manually only when the H8 source DOCX files change.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-final-clean-h8-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editable branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build final clean preview site
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-dejavu
          python3 -m pip install --upgrade python-docx pypdf pillow
          python3 scripts/build_final_clean_preview_site.py

      - name: Commit final clean preview site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/final-clean-h8 previews/final-clean-h8.html
          git diff --cached --quiet && echo "No preview changes" && exit 0
          git commit -m "publish final clean H8 preview [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
