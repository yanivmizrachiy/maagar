name: Apply Neutral Credit Batch 5

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/add-neutral-metadata-credits-batch5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply verified neutral credits
        run: python3 scripts/apply-neutral-credit-batch5.py

      - name: Remove temporary tooling and commit metadata
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          rm scripts/apply-neutral-credit-batch5.py
          rm .github/workflows/apply-neutral-credit-batch5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add neutral metadata credits batch 5"
          git push origin "HEAD:${TARGET_BRANCH}"
