name: Topic Organizer

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes to metadata/index.json and site grouping"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  topic-organizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate topic map
        run: |
          python3 scripts/validate-topic-map.py

      - name: Run audits
        run: |
          mkdir -p reports
          python3 scripts/topic-organizer.py --report reports/topic-audit.json
          python3 scripts/metadata-audit.py --report reports/metadata-audit.json

      - name: Apply topic organization and site grouping
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          python3 scripts/topic-organizer.py --apply --report reports/topic-audit.json
          python3 scripts/patch-site-topic-groups.py
          python3 scripts/metadata-audit.py --report reports/metadata-audit.json
          bash scripts/validate-all.sh
          python3 scripts/validate-topic-map.py
          python3 scripts/test-logic.py

      - name: Commit changes
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/index.json reports/*.json index.html
          if git diff --cached --quiet; then
            echo "No topic changes to commit"
          else
            git commit -m "chore(topics): organize metadata and site grouping"
            git push
          fi

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: maagar-topic-audit
          path: reports/*.json
