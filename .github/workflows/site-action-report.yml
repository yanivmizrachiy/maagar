name: Site Action Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site-action-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and validate site action report
        run: |
          mkdir -p reports
          python3 scripts/site-action-report.py --report reports/site-action-report.json
          python3 scripts/validate-site-action-report.py --report reports/site-action-report.json
          python3 scripts/site-action-report-md.py --json reports/site-action-report.json --md reports/site-action-report.md
          python3 scripts/polish-site-action-report-md.py --md reports/site-action-report.md

      - name: Upload site action reports
        uses: actions/upload-artifact@v4
        with:
          name: maagar-site-action-report
          path: reports/site-action-report.*

  build-real-h8-summer-work:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install document conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-dejavu
          python3 -m pip install --upgrade python-docx pypdf pillow

      - name: Build real H8 scientific summer work from source DOCX
        run: |
          python3 scripts/build_summer_work_h8_madait.py
          python3 - <<'PY'
          from pypdf import PdfReader
          p='outputs/summer-work-h8-madait/avoda-kayitz-h8-madait-full.pdf'
          print('REAL_PDF_PAGES=', len(PdfReader(p).pages))
          PY

      - name: Upload real summer work files
        uses: actions/upload-artifact@v4
        with:
          name: avoda-kayitz-h8-madait-real
          path: |
            outputs/summer-work-h8-madait/**
            previews/avoda-kayitz-h8-madait-real.html

  publish-final-clean-h8-preview:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build final clean preview site
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-dejavu
          python3 -m pip install --upgrade python-docx pypdf pillow
          python3 scripts/build_final_clean_h8_pdf.py

      - name: Commit final clean preview site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/final-clean-h8 previews/final-clean-h8.html
          git diff --cached --quiet && echo "No preview changes" && exit 0
          git commit -m "publish final clean H8 preview [skip ci]"
          git push
