name: Site Action Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site-action-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and validate site action report
        run: |
          mkdir -p reports
          python3 scripts/site-action-report.py --report reports/site-action-report.json
          python3 scripts/validate-site-action-report.py --report reports/site-action-report.json
          python3 scripts/site-action-report-md.py --json reports/site-action-report.json --md reports/site-action-report.md
          python3 scripts/polish-site-action-report-md.py --md reports/site-action-report.md

      - name: Upload site action reports
        uses: actions/upload-artifact@v4
        with:
          name: maagar-site-action-report
          path: reports/site-action-report.*

  publish-final-clean-h8-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editable branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build final clean preview site
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-dejavu
          python3 -m pip install --upgrade python-docx pypdf pillow
          python3 scripts/build_final_clean_preview_site.py

      - name: Commit final clean preview site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/final-clean-h8 previews/final-clean-h8.html
          git diff --cached --quiet && echo "No preview changes" && exit 0
          git commit -m "publish final clean H8 preview [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
