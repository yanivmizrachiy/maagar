name: Import Grade 7 placement test PDF

on:
  push:
    paths:
      - '.github/workflows/import-miyun-z-20261011.yml'

permissions:
  contents: write

jobs:
  import-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PDF
        env:
          SOURCE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-57d4-81f4-99f3-7618620dc54b/raw?se=2026-10-10T19%3A42%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=d4dcb0ad-7bfe-52e1-bdb0-7e7916a3fa8f&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T05%3A05%3A26Z&ske=2026-10-11T05%3A05%3A26Z&sks=b&skv=2026-02-06&sig=F%2BEeMf8oMAhKPVhUifkO89RrbXsGU1xBBmRbY%2BGyqp4%3D"
        run: |
          set -euo pipefail
          mkdir -p 'files/middle-school/grade-7/exams'
          curl -fL "$SOURCE_URL" -o 'files/middle-school/grade-7/exams/מבחן-מיון-ז-11-10-2026.pdf'
          test -s 'files/middle-school/grade-7/exams/מבחן-מיון-ז-11-10-2026.pdf'
      - name: Commit PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'files/middle-school/grade-7/exams/מבחן-מיון-ז-11-10-2026.pdf'
          git diff --cached --quiet && exit 0
          git commit -m 'Add Grade 7 placement test for 2026-10-11'
          git push
