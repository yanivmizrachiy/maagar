name: Site Topic Groups

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Patch site topic groups
        run: |
          python3 scripts/patch-site-topic-groups.py
          bash scripts/validate-all.sh
          python3 scripts/test-logic.py

      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site grouping changes to commit"
          else
            git commit -m "feat(site): group files by topic"
            git push
          fi
