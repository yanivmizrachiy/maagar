name: Validate Maagar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install first-page PDF reader
        run: |
          python3 -m pip install "pypdf>=5,<7"

      - name: First-page credit audit
        run: |
          mkdir -p reports
          python3 scripts/first-page-credit-audit.py --report reports/first-page-credit-audit.json

      - name: Upload first-page credit audit
        uses: actions/upload-artifact@v4
        with:
          name: first-page-credit-audit
          path: reports/first-page-credit-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare verified first-page credit batch
        run: |
          python3 scripts/apply-first-page-credit-batch3.py

      - name: Upload updated metadata index
        uses: actions/upload-artifact@v4
        with:
          name: first-page-credit-index
          path: reports/index-with-first-page-credits.json
          if-no-files-found: error
          retention-days: 7

      - name: Apply metadata and remove temporary tooling
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cp reports/index-with-first-page-credits.json metadata/index.json
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/validate.yml
          rm scripts/first-page-credit-audit.py
          rm scripts/apply-first-page-credit-batch3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified credits from first pages"
          git push origin "HEAD:${TARGET_BRANCH}"
