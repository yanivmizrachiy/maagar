name: Validate Maagar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate single rules page
        run: |
          python3 scripts/validate-single-rules-page.py

      - name: Validate workflow site checks
        run: |
          python3 scripts/validate-workflow-site-checks.py

      - name: Validate site shell
        run: |
          python3 scripts/validate-site-shell.py
          python3 scripts/validate-real-buttons.py
          node --check assets/site.js
          node --check assets/site-url-state.js
          node --check assets/site-deeplink.js
          node --check assets/site-share.js
          node --check assets/site-view-share.js
          node --check assets/site-modal-share.js
          node --check assets/site-help.js

      - name: Validate browser metadata contract
        run: |
          python3 scripts/validate-site-data-contract.py

      - name: Validate file links
        run: |
          python3 scripts/validate-file-links.py

      - name: Validate metadata
        run: |
          bash scripts/validate-all.sh

      - name: Validate topic map
        run: |
          python3 scripts/validate-topic-map.py

      - name: Validate navigation
        run: |
          python3 scripts/test-logic.py

      - name: Topic organizer dry run
        run: |
          mkdir -p reports
          python3 scripts/topic-organizer.py --report reports/topic-audit.json

      - name: Metadata audit
        run: |
          python3 scripts/metadata-audit.py --report reports/metadata-audit.json

      - name: Smart topic review
        run: |
          python3 scripts/smart-topic-review.py --report reports/smart-topic-review.json

      - name: Smart cleanup plan
        run: |
          python3 scripts/smart-cleanup-plan.py --json reports/smart-cleanup-plan.json --md reports/smart-cleanup-plan.md

      - name: Site action report
        run: |
          python3 scripts/site-action-report.py --report reports/site-action-report.json
          python3 scripts/site-action-report-md.py --json reports/site-action-report.json --md reports/site-action-report.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: maagar-audit-reports
          path: reports/*
