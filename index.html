<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>מאגר מתמטיקה</title>
  <meta name="description" content="מאגר קבצי מתמטיקה עם צפייה מוטמעת, פתיחה בכרטיסייה, הורדה ושיתוף">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <noscript>
    <div style="padding:3rem;text-align:center;color:white;background:#07111f;min-height:100vh;direction:rtl;font-family:Arial,sans-serif">
      יש להפעיל JavaScript כדי להשתמש במאגר הקבצים.
    </div>
  </noscript>

  <header class="top">
    <div class="bar">
      <div>
        <div class="brand">∑ מאגר מתמטיקה</div>
        <div class="sub">צפייה מוטמעת · פתיחה · הורדה · שיתוף</div>
      </div>
      <input id="q" class="q" type="search" placeholder="חפש לפי שם, נושא, כיתה או סוג קובץ" autocomplete="off">
      <button id="clear" class="btn">נקה</button>
    </div>
  </header>

  <div class="wrap">
    <section class="hero">
      <div class="box">
        <h1>כל הקבצים במקום אחד</h1>
        <p>בחר שכבה ותחום, ראה קבצים לפי נושאים, פתח צפייה מוטמעת, פתח בכרטיסייה, הורד או שתף קישור למורים ותלמידים.</p>
      </div>
      <div id="stats" class="stats"></div>
    </section>

    <section id="filters"></section>

    <div class="head">
      <h2 id="ttl">טוען...</h2>
      <span id="meta"></span>
    </div>

    <main id="app" class="load">טוען קבצים...</main>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="panel">
      <div class="mh">
        <div>
          <div id="mt" class="mt">קובץ</div>
          <div id="ms" class="sub">צפייה מוטמעת</div>
        </div>
        <div class="ma">
          <a id="mo" class="act" target="_blank" rel="noopener noreferrer">↗ פתח</a>
          <a id="md" class="act down">⬇ הורדה</a>
          <button id="x" class="x" aria-label="סגור">×</button>
        </div>
      </div>
      <div class="vw">
        <iframe id="viewer" class="viewer" title="תצוגת קובץ"></iframe>
      </div>
    </div>
  </div>

  <script src="assets/site.js"></script>
  <script src="assets/site-url-state.js"></script>
  <script src="assets/site-deeplink.js"></script>
  <script src="assets/site-share.js"></script>
  <script src="assets/site-view-share.js"></script>
  <script src="assets/site-modal-share.js"></script>
</body>
</html>
