<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מאגר מתמטיקה</title>
  <meta name="description" content="מאגר קבצים ומשימות מתמטיקה לפי שכבה, תחום ורמה">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: 'Heebo', 'Arial Hebrew', Arial, sans-serif;

      /* Backgrounds */
      --bg:        #070B14;
      --bg2:       #0C1120;
      --surface:   #111827;
      --surface2:  #1A2236;
      --surface3:  #222D44;
      --surface-glass: rgba(17,24,39,0.7);

      /* Borders */
      --border:       rgba(255,255,255,0.06);
      --border-mid:   rgba(255,255,255,0.10);
      --border-hover: rgba(255,255,255,0.22);
      --border-glow:  rgba(99,102,241,0.35);

      /* Text */
      --text:       #F0F4FC;
      --text-muted: #8A9BC0;
      --text-dim:   #4A5878;

      /* Radius */
      --radius:    22px;
      --radius-sm: 14px;
      --radius-xs:  8px;

      /* Shadows */
      --shadow:    0 2px 16px rgba(0,0,0,0.45);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.55);
      --shadow-lg: 0 16px 56px rgba(0,0,0,0.65);
      --shadow-xl: 0 28px 80px rgba(0,0,0,0.75);

      /* Header */
      --header-h: 58px;
    }

    /* ── FOCUS ─────────────────────────────── */
    :focus-visible {
      outline: 2px solid rgba(99,102,241,0.7);
      outline-offset: 3px;
      border-radius: 6px;
    }

    /* ── BASE ──────────────────────────────── */
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 55% at 15% -5%, rgba(99,102,241,0.11) 0%, transparent 55%),
        radial-gradient(ellipse 70% 40% at 85% 105%, rgba(8,145,178,0.08) 0%, transparent 50%),
        radial-gradient(ellipse 50% 35% at 50% 50%, rgba(139,92,246,0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ─────────────────────────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-h);
      background: rgba(7,11,20,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.5rem;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      flex-shrink: 0;
    }

    .header-logo-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .header-logo-text {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .header-logo-text span {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-right: 0.3rem;
    }

    .breadcrumbs {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      overflow: hidden;
      min-width: 0;
    }

    .bc-item {
      color: var(--text-dim);
      background: none;
      border: none;
      font-family: var(--font);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
      padding: 0.2rem 0.35rem;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }
    .bc-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .bc-item.active { color: var(--text-muted); cursor: default; font-weight: 500; }
    .bc-item.active:hover { background: none; }

    .bc-sep { color: var(--text-dim); flex-shrink: 0; font-size: 0.7rem; opacity: 0.5; }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface2);
      border: 1px solid var(--border-mid);
      color: var(--text-muted);
      padding: 0.38rem 0.85rem;
      border-radius: var(--radius-xs);
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
      background: var(--surface3);
    }

    /* ── MAIN ──────────────────────────────── */
    .main {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── HERO ──────────────────────────────── */
    .hero {
      text-align: center;
      padding: 3.5rem 1rem 3rem;
      position: relative;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      color: #A5B4FC;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      letter-spacing: 0.03em;
    }

    .hero-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #F0F4FC 30%, #A5B4FC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .hero-sub {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 400;
      max-width: 480px;
      margin: 0 auto 2rem;
      line-height: 1.65;
    }

    .hero-stats {
      display: inline-flex;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .hero-stat {
      padding: 0.6rem 1.25rem;
      text-align: center;
    }
    .hero-stat + .hero-stat {
      border-right: 1px solid var(--border);
    }
    .hero-stat-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      display: block;
      letter-spacing: -0.02em;
    }
    .hero-stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      display: block;
      margin-top: 0.1rem;
      white-space: nowrap;
    }

    /* ── SECTION DIVIDER ─────────────────────── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
      margin-top: 2.5rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── GRADE CARDS GRID ────────────────────── */
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    @media (max-width: 580px) {
      .grade-grid { grid-template-columns: 1fr; }
    }

    /* ── GRADE CARD ──────────────────────────── */
    .grade-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
      transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s, border-color 0.2s;
      text-align: right;
      color: white;
      font-family: var(--font);
      padding: 0;
      display: block;
      width: 100%;
    }

    .grade-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
    }

    .grade-card:active { transform: translateY(-2px) scale(0.995); }

    .grade-card-bg {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      transition: opacity 0.2s;
    }
    .grade-card:hover .grade-card-bg { opacity: 0.2; }

    .grade-card-accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .grade-card-body {
      position: relative;
      padding: 1.75rem 1.5rem 1.5rem;
    }

    .grade-card-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.65rem;
      margin-bottom: 1.1rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .grade-card-label {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }

    .grade-card-desc {
      font-size: 0.78rem;
      opacity: 0.6;
      font-weight: 400;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .grade-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grade-card-count {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.13);
    }

    .grade-card-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: background 0.15s, transform 0.15s;
    }
    .grade-card:hover .grade-card-arrow {
      background: rgba(255,255,255,0.22);
      transform: translateX(-3px);
    }

    /* ── SCREEN BANNER ───────────────────────── */
    .screen-banner {
      border-radius: var(--radius);
      padding: 1.75rem 2rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    .screen-banner-bg {
      position: absolute;
      inset: 0;
      opacity: 0.22;
    }

    .screen-banner-body { position: relative; }

    .screen-banner h1 {
      font-size: 1.65rem;
      font-weight: 900;
      color: white;
      letter-spacing: -0.02em;
      margin: 0 0 0.3rem;
    }

    .screen-banner-meta {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.65);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .screen-banner-meta-sep { opacity: 0.4; }

    /* ── CATEGORY GRID ───────────────────────── */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    @media (max-width: 560px) { .cat-grid { grid-template-columns: 1fr; } }

    .cat-extra {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
    }
    .cat-extra .grade-card { max-width: 320px; }

    /* ── FILES GRID ──────────────────────────── */
    .files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    /* ── FILE CARD ───────────────────────────── */
    .file-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.18s cubic-bezier(.2,.8,.2,1), box-shadow 0.18s;
    }
    .file-card:hover {
      border-color: var(--border-mid);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .fc-type-strip {
      height: 4px;
      flex-shrink: 0;
    }

    .fc-body {
      padding: 1.25rem 1.25rem 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .fc-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .fc-type-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .fc-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text);
      flex: 1;
      padding-top: 0.1rem;
    }

    .fc-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .badge {
      font-size: 0.67rem;
      font-weight: 700;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      letter-spacing: 0.01em;
      line-height: 1.5;
    }
    .badge-grade  { background: rgba(139,92,246,0.18); color: #C4B5FD; border: 1px solid rgba(139,92,246,0.2); }
    .badge-cat    { background: rgba(16,185,129,0.14); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.18); }
    .badge-type   { background: rgba(245,158,11,0.14); color: #FCD34D; border: 1px solid rgba(245,158,11,0.18); }

    .fc-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .topic-tag {
      font-size: 0.68rem;
      padding: 0.15rem 0.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text-dim);
    }

    .fc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .fc-meta span { display: flex; align-items: center; gap: 0.25rem; }

    .fc-actions {
      padding: 0.85rem 1.25rem;
      display: flex;
      gap: 0.45rem;
      border-top: 1px solid var(--border);
      margin-top: 0.65rem;
      flex-wrap: wrap;
    }

    /* ── ACTION BUTTONS ──────────────────────── */
    .act-btn {
      flex: 1;
      min-width: 68px;
      padding: 0.52rem 0.7rem;
      border-radius: var(--radius-xs);
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.76rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      transition: all 0.13s;
      line-height: 1;
      letter-spacing: 0.01em;
    }
    .act-btn:hover { transform: translateY(-1px); }
    .act-btn:active { transform: scale(0.97); }

    .act-view {
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: white;
      box-shadow: 0 2px 10px rgba(99,102,241,0.4);
    }
    .act-view:hover { box-shadow: 0 4px 18px rgba(99,102,241,0.55); opacity: 0.95; }

    .act-download {
      background: var(--surface2);
      border: 1px solid var(--border-mid);
      color: var(--text-muted);
    }
    .act-download:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface3); }

    .act-print {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .act-print:hover { border-color: var(--border-mid); color: var(--text-muted); }

    /* ── EMPTY STATE ─────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem 4rem;
    }

    .empty-illustration {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.75rem;
      background: var(--surface2);
      border: 1px solid var(--border-mid);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      position: relative;
      animation: emptyBreath 3.5s ease-in-out infinite;
    }
    .empty-illustration::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 28px;
      border: 1px solid rgba(99,102,241,0.12);
      animation: emptyRing 3.5s ease-in-out infinite;
    }
    @keyframes emptyBreath {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.75; }
    }
    @keyframes emptyRing {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(1.08); }
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .empty-msg {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.7;
      max-width: 320px;
      margin: 0 auto;
    }

    /* ── PDF MODAL ───────────────────────────── */
    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      width: 100%;
      max-width: 940px;
      height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.18s ease;
    }

    .modal-head {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
      background: var(--surface2);
    }

    .modal-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .modal-label {
      font-size: 0.65rem;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.15rem;
    }

    .modal-title {
      font-weight: 700;
      font-size: 0.9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .modal-acts { display: flex; gap: 0.45rem; flex-shrink: 0; align-items: center; }

    .modal-body { flex: 1; position: relative; overflow: hidden; background: #0A0E18; }

    .pdf-frame { width: 100%; height: 100%; border: none; display: block; }

    /* Loading overlay — shown while iframe is loading */
    .pdf-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #0A0E18;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .pdf-loading.hidden { opacity: 0; }
    .pdf-loading-spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(99,102,241,0.15);
      border-top-color: rgba(99,102,241,0.7);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .pdf-loading-text { font-size: 0.78rem; color: var(--text-dim); }

    .pdf-fallback {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: var(--surface2);
      padding: 2rem;
      text-align: center;
      z-index: 3;
    }
    .pdf-fallback.visible { display: flex; }
    .pdf-fallback-icon { font-size: 2.5rem; opacity: 0.5; }
    .pdf-fallback p { color: var(--text-muted); font-size: 0.88rem; line-height: 1.7; max-width: 360px; }

    .pdf-fallback-actions {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      background: var(--surface3);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.13s;
      flex-shrink: 0;
    }
    .modal-close:hover { background: var(--surface); color: var(--text); border-color: var(--border-hover); }

    /* ── LOADING ─────────────────────────────── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    /* ── ERROR ───────────────────────────────── */

    /* ── SCREEN FADE-IN ──────────────────────── */

    /* ── HIGH SCHOOL LIST ────────────────────── */

    .unit-card-sublabel { font-size: 0.75rem; opacity: 0.5; line-height: 1.4; }

    .unit-card-count {

    /* ── SEARCH BUTTON (header) ─────────────── */

    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus {

    .search-filters {

    .filter-chip {

<!-- ── HEADER ──────────────────────────────────── -->

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const S = {
  index: null,
  structure: null,
  screen: { type: 'home' },
  history: []
};

// ═══════════════════════════════════════════════════════════
// DESIGN CONFIG  ←  Edit here to change colors / icons / labels
// To change grade colors → GRADE_IDENTITY
// To change category colors → CAT_IDENTITY
// To change HS level colors → UNIT_IDENTITY
// To change file-card strip colors → DOCTYPE_STRIP
// See docs/EDITING_GUIDE.md for full editing guide
// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════
// LABELS (Hebrew)
// ═══════════════════════════════════════════════════════════
const CATEGORY_HE = {
  algebra:      'אלגברה',
  geometry:     'גיאומטריה',
  summaries:    'משימות מסכמות',
  exams:        'מבחנים',
  uncategorized:'חומרים שונים',
  unknown:      'חומרים שונים'
};

const DOCTYPE_HE = {
  'worksheet':          'עבודה',
  'summary-work':       'משימה מסכמת',
  'exam':               'מבחן',
  'link':               'קישור',
  'digital-task':       'משימה מתוקשבת',
  'printable-task':     'להדפסה',
  'embedded-resource':  'משאב',
  'mixed':              'מעורב',
  'unknown':            ''
};

const GRADE_HE = { '7': 'שכבת ז׳', '8': 'שכבת ח׳', '9': 'שכבת ט׳' };
const UNIT_HE  = { '3-unit':'שלוש יחידות', '4-unit':'ארבע יחידות', '5-unit':'חמש יחידות' };

// Visual identities per grade/section
const GRADE_IDENTITY = {
  '7':           { bg: 'linear-gradient(135deg,#4338CA,#6D28D9)', accent: '#6366F1', desc: 'אלגברה · גיאומטריה · מבחנים · סיכומים', icon: '📐' },
  '8':           { bg: 'linear-gradient(135deg,#0369A1,#0891B2)', accent: '#22D3EE', desc: 'אלגברה · גיאומטריה · מבחנים · סיכומים', icon: '📊' },
  '9':           { bg: 'linear-gradient(135deg,#1D4ED8,#4F46E5)', accent: '#60A5FA', desc: 'אלגברה · גיאומטריה · מבחנים · סיכומים', icon: '📏' },
  'high-school': { bg: 'linear-gradient(135deg,#92400E,#B45309)', accent: '#F59E0B', desc: 'בגרות 3 · 4 · 5 יחידות', icon: '🎓' }
};

const CAT_IDENTITY = {
  algebra:       { bg: 'linear-gradient(135deg,#3730A3,#5B21B6)', accent: '#818CF8', icon: '✕' },
  geometry:      { bg: 'linear-gradient(135deg,#065F46,#047857)', accent: '#34D399', icon: '△' },
  summaries:     { bg: 'linear-gradient(135deg,#78350F,#92400E)', accent: '#FBBF24', icon: '◎' },
  exams:         { bg: 'linear-gradient(135deg,#881337,#9F1239)', accent: '#FB7185', icon: '≡' },
  uncategorized: { bg: 'linear-gradient(135deg,#1E293B,#334155)', accent: '#94A3B8', icon: '◫' }
};

const UNIT_IDENTITY = {
  '3-unit': { bg: 'linear-gradient(135deg,#1E3A5F,#1D4ED8)', accent: '#60A5FA', sublabel: 'בגרות מתמטיקה ברמה בסיסית', icon: '🔵' },
  '4-unit': { bg: 'linear-gradient(135deg,#3730A3,#5B21B6)', accent: '#A78BFA', sublabel: 'בגרות מתמטיקה ברמה מוגברת', icon: '🔷' },
  '5-unit': { bg: 'linear-gradient(135deg,#78350F,#B45309)', accent: '#FCD34D', sublabel: 'בגרות מתמטיקה ברמה גבוהה', icon: '⭐' }
};

const DOCTYPE_ICON = {
  'worksheet':         '📄',
  'summary-work':      '📋',
  'exam':              '📝',
  'link':              '🔗',
  'digital-task':      '💻',
  'printable-task':    '🖨',
  'embedded-resource': '📎',
  'mixed':             '📚',
  'unknown':           '📄'
};

const DOCTYPE_STRIP = {
  'worksheet':         'linear-gradient(90deg,#4338CA,#6D28D9)',
  'summary-work':      'linear-gradient(90deg,#065F46,#047857)',
  'exam':              'linear-gradient(90deg,#881337,#9F1239)',
  'link':              'linear-gradient(90deg,#0369A1,#0891B2)',
  'digital-task':      'linear-gradient(90deg,#0369A1,#0891B2)',
  'printable-task':    'linear-gradient(90deg,#78350F,#92400E)',
  'embedded-resource': 'linear-gradient(90deg,#374151,#4B5563)',
  'mixed':             'linear-gradient(90deg,#374151,#4B5563)',
  'unknown':           'linear-gradient(90deg,#1E293B,#334155)'
};

// Hebrew count label with correct grammar
function countLabel(n) {
  if (n === 0) return 'אין עדיין קבצים';
  if (n === 1) return 'קובץ אחד';
  return `${n} קבצים`;
}

// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════
async function loadData() {
  try {
    const [idxRes, ssRes] = await Promise.all([
      fetch('./metadata/index.json'),
      fetch('./metadata/site-structure.json')
    ]);
    if (!idxRes.ok) throw new Error(`index.json: HTTP ${idxRes.status}`);
    if (!ssRes.ok)  throw new Error(`site-structure.json: HTTP ${ssRes.status}`);
    S.index     = await idxRes.json();
    S.structure = await ssRes.json();
    renderScreen();
  } catch (e) {
    renderError(e);
  }
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function navigate(screen) {
  S.history.push({ ...S.screen });
  S.screen = screen;
  renderScreen();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function goBack() {
  if (S.history.length === 0) return;
  S.screen = S.history.pop();
  renderScreen();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function navHome()         { navigate({ type: 'home' }); }
function navGrade(g)       { navigate({ type: 'grade', grade: g }); }
function navCat(g, c)      { navigate({ type: 'category', grade: g, category: c }); }
function navHSHome()       { navigate({ type: 'hs-home' }); }
function navUnit(u)        { navigate({ type: 'unit', unitLevel: u }); }
function navSearch()       { navigate({ type: 'search', query: '', gradeFilter: '', doctypeFilter: '' }); }

// ═══════════════════════════════════════════════════════════
// FILTERING
// ═══════════════════════════════════════════════════════════
function filesForGradeCat(grade, category) {
  return S.index.files.filter(f => {
    const gradeMatch = f.grade === grade || (Array.isArray(f.grades) && f.grades.includes(grade));
    if (!gradeMatch) return false;
    // 'uncategorized' bucket catches both 'uncategorized' and 'unknown' primary_category
    if (category === 'uncategorized') {
      return f.primary_category === 'uncategorized' || f.primary_category === 'unknown';
    }
    return f.primary_category === category;
  });
}

function uncategorizedCountForGrade(grade) {
  return filesForGradeCat(grade, 'uncategorized').length;
}

function filesForUnit(unitLevel) {
  return S.index.files.filter(f =>
    f.school_stage === 'high-school' && f.unit_level === unitLevel
  );
}

function countForGrade(grade) {
  return S.index.files.filter(f =>
    f.grade === grade || (Array.isArray(f.grades) && f.grades.includes(grade))
  ).length;
}

// ═══════════════════════════════════════════════════════════
// RENDER DISPATCHER
// ═══════════════════════════════════════════════════════════
function renderScreen() {
  const app     = document.getElementById('app');
  const backBtn = document.getElementById('back-btn');
  const bcs     = document.getElementById('breadcrumbs');
  backBtn.style.display = S.history.length > 0 ? '' : 'none';

  const sc = S.screen;
  if      (sc.type === 'home')     renderHome(app, bcs);
  else if (sc.type === 'grade')    renderGrade(app, bcs, sc.grade);
  else if (sc.type === 'category') renderCategory(app, bcs, sc.grade, sc.category);
  else if (sc.type === 'hs-home')  renderHSHome(app, bcs);
  else if (sc.type === 'unit')     renderUnit(app, bcs, sc.unitLevel);
  else if (sc.type === 'search')   renderSearch(app, bcs, sc);
}

// ═══════════════════════════════════════════════════════════
// SCREEN: HOME
// ═══════════════════════════════════════════════════════════
function renderHome(app, bcs) {
  document.title = 'מאגר מתמטיקה';
  bcs.innerHTML  = `<span class="bc-item active">בית</span>`;

  const ss    = S.structure;
  const total = S.index.files.length;
  const hsCount = S.index.files.filter(f => f.school_stage === 'high-school').length;
  const msCount = total - hsCount;

  const cards = ss.home.buttons.map(btn => {
    const isHS    = btn.id === 'high-school';
    const count   = isHS
      ? S.index.files.filter(f => f.school_stage === 'high-school').length
      : countForGrade(btn.grade);
    const id      = isHS ? 'high-school' : `grade-${btn.grade}`;
    const idn     = GRADE_IDENTITY[isHS ? 'high-school' : btn.grade] || {};
    const onclick = isHS ? 'navHSHome()' : `navGrade('${btn.grade}')`;

    return `<button class="grade-card" onclick="${onclick}" aria-label="${h(btn.label)}">
      <div class="grade-card-bg" style="background:${idn.bg || btn.style.background}"></div>
      <div class="grade-card-accent" style="background:${idn.bg || btn.style.background}"></div>
      <div class="grade-card-body">
        <div class="grade-card-icon">${idn.icon || '📚'}</div>
        <div class="grade-card-label">${h(btn.label)}</div>
        <div class="grade-card-desc">${h(idn.desc || '')}</div>
        <div class="grade-card-footer">
          <span class="grade-card-count">${countLabel(count)}</span>
          <span class="grade-card-arrow">←</span>
        </div>
      </div>
    </button>`;
  }).join('');

  app.innerHTML = `<div class="screen-enter">
    <div class="hero">
      <div class="hero-eyebrow">✦ חומרי לימוד מקצועיים</div>
      <h1 class="hero-title">מאגר חומרי לימוד<br>במתמטיקה</h1>
      <p class="hero-sub">גישה מהירה לכל החומרים לפי שכבה, תחום וסוג מסמך. מיועד למורים ולתלמידים.</p>
      <div class="hero-stats">
        <div class="hero-stat">
          <span class="hero-stat-val">${total}</span>
          <span class="hero-stat-label">קבצים</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-val">3</span>
          <span class="hero-stat-label">שכבות ביניים</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-val">3</span>
          <span class="hero-stat-label">רמות עליונה</span>
        </div>
      </div>
    </div>
    <div class="section-label">בחר שכבת לימוד</div>

// SCREEN: GRADE (ז׳ / ח׳ / ט׳)
// ═══════════════════════════════════════════════════════════
function renderGrade(app, bcs, grade) {
  const gradeLabel = GRADE_HE[grade] || `כיתה ${grade}`;
  document.title   = `${gradeLabel} — מאגר מתמטיקה`;
  bcs.innerHTML    = `
    <button class="bc-item" onclick="navHome()">בית</button>
    <span class="bc-sep">›</span>
    <span class="bc-item active">${h(gradeLabel)}</span>`;

  const ss   = S.structure;
  const cats = ['algebra', 'geometry', 'summaries', 'exams'];
  const idn  = GRADE_IDENTITY[grade] || {};

  const cardList = cats.map(cat => {
    const info  = ss.category_cards[cat];
    const count = filesForGradeCat(grade, cat).length;
    const cidn  = CAT_IDENTITY[cat] || {};
    return `<button class="grade-card" onclick="navCat('${grade}','${cat}')" aria-label="${h(info.label)}">
      <div class="grade-card-bg" style="background:${cidn.bg}"></div>
      <div class="grade-card-accent" style="background:${cidn.bg}"></div>
      <div class="grade-card-body">
        <div class="grade-card-icon" style="background:rgba(255,255,255,0.1)">${cidn.icon || '📄'}</div>
        <div class="grade-card-label">${h(info.label)}</div>
        <div class="grade-card-desc">${count === 0 ? 'עדיין לא הועלו קבצים לקטגוריה זו' : `${countLabel(count)} זמינים`}</div>
        <div class="grade-card-footer">
          <span class="grade-card-count">${countLabel(count)}</span>
          <span class="grade-card-arrow">←</span>
        </div>
      </div>
    </button>`;
  });

  const uncatCount = uncategorizedCountForGrade(grade);
  if (uncatCount > 0) {
    const cidn = CAT_IDENTITY.uncategorized;
    cardList.push(`<button class="grade-card" onclick="navCat('${grade}','uncategorized')" aria-label="חומרים שונים">
      <div class="grade-card-bg" style="background:${cidn.bg}"></div>
      <div class="grade-card-accent" style="background:${cidn.bg}"></div>
      <div class="grade-card-body">
        <div class="grade-card-icon">◫</div>
        <div class="grade-card-label">חומרים שונים</div>
        <div class="grade-card-desc">קבצים שטרם סווגו לקטגוריה ספציפית</div>
        <div class="grade-card-footer">
          <span class="grade-card-count">${countLabel(uncatCount)}</span>
          <span class="grade-card-arrow">←</span>
        </div>
      </div>
    </button>`);
  }

  const gridHtml = cardList.length === 5
    ? `<div class="cat-grid">${cardList.slice(0,4).join('')}</div>
       <div class="cat-extra">${cardList[4]}</div>`
    : `<div class="cat-grid">${cardList.join('')}</div>`;

  app.innerHTML = `<div class="screen-enter">
    <div class="screen-banner" style="background:${idn.bg || '#111'}">
      <div class="screen-banner-body">
        <h1>${h(gradeLabel)}</h1>
        <div class="screen-banner-meta">
          <span>${countLabel(countForGrade(grade))} בסה"כ</span>
          <span class="screen-banner-meta-sep">·</span>
          <span>בחר תחום לימוד</span>
        </div>
      </div>
    </div>
    ${gridHtml}
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// SCREEN: SEARCH
// ═══════════════════════════════════════════════════════════
function renderSearch(app, bcs, sc) {
  document.title = 'חיפוש — מאגר מתמטיקה';
  bcs.innerHTML  = `
    <button class="bc-item" onclick="navHome()">בית</button>
    <span class="bc-sep">›</span>
    <span class="bc-item active">חיפוש</span>`;

  const query        = sc.query        || '';
  const gradeFilter  = sc.gradeFilter  || '';
  const doctypeFilter= sc.doctypeFilter|| '';

  // Filter files
  const q = query.trim().toLowerCase();
  let results = S.index.files.filter(f => {
    if (gradeFilter  && f.grade !== gradeFilter && !(Array.isArray(f.grades) && f.grades.includes(gradeFilter))) return false;
    if (doctypeFilter && f.document_type !== doctypeFilter) return false;
    if (!q) return true;
    const titleMatch  = (f.title || '').toLowerCase().includes(q);
    const topicMatch  = (f.topics || []).some(t => t.toLowerCase().includes(q));
    const tagMatch    = (f.tags   || []).some(t => t.toLowerCase().includes(q));
    const catMatch    = (CATEGORY_HE[f.primary_category] || '').includes(q);
    const gradeMatch  = (GRADE_HE[f.grade] || '').includes(q);
    return titleMatch || topicMatch || tagMatch || catMatch || gradeMatch;
  });

  // Grade filter chips
  const grades = ['7','8','9'];
  const gradeChips = grades.map(g => {
    const active = gradeFilter === g ? ' active' : '';
    const label  = GRADE_HE[g] || `כיתה ${g}`;
    return `<button class="filter-chip${active}" onclick="setSearchFilter('grade','${g}')">${h(label)}</button>`;
  }).join('');

  // Doctype filter chips (only types present in index)
  const presentTypes = [...new Set(S.index.files.map(f => f.document_type).filter(Boolean))];
  const dtChips = presentTypes.map(dt => {
    const active = doctypeFilter === dt ? ' active' : '';
    const label  = DOCTYPE_HE[dt] || dt;
    if (!label) return '';
    return `<button class="filter-chip${active}" onclick="setSearchFilter('doctype','${dt}')">${h(label)}</button>`;
  }).join('');

  const clearGrade   = gradeFilter  ? `<button class="filter-chip active" onclick="setSearchFilter('grade','')">✕ ${h(GRADE_HE[gradeFilter] || gradeFilter)}</button>` : '';
  const clearDoctype = doctypeFilter? `<button class="filter-chip active" onclick="setSearchFilter('doctype','')">✕ ${h(DOCTYPE_HE[doctypeFilter]||doctypeFilter)}</button>` : '';

  const metaText = q || gradeFilter || doctypeFilter
    ? `נמצאו ${results.length} תוצאות`
    : `${S.index.files.length} קבצים במאגר`;

  const resultsHtml = results.length === 0
    ? `<div class="search-empty">
        <div class="search-empty-icon">🔍</div>
        <div class="search-empty-title">לא נמצאו תוצאות</div>
        <div class="search-empty-msg">נסה מילות חיפוש אחרות או שנה את הסינון.</div>
       </div>`
    : `<div class="files-grid">${results.map(fileCard).join('')}</div>`;

  app.innerHTML = `<div class="screen-enter">
    <div class="search-wrap">
      <div class="search-header">
        <div class="search-header-title">חיפוש חומרי לימוד</div>
        <div class="search-header-sub">חפש לפי כותרת, נושא, שכבה או סוג מסמך</div>
      </div>
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-field" type="search"
          placeholder="חפש לפי שם, נושא, תגית..."
          value="${h(query)}"
          oninput="updateSearchQuery(this.value)"
          autofocus>
      </div>
      <div class="search-filters">
        ${gradeChips}
        ${dtChips}
        ${clearGrade}
        ${clearDoctype}
      </div>
      <div class="search-results-meta">${metaText}</div>
      ${resultsHtml}
    </div>
  </div>`;

  // Focus cursor at end of input on re-render
  const inp = document.getElementById('search-field');
  if (inp) { const len = inp.value.length; inp.setSelectionRange(len, len); }
}

function updateSearchQuery(val) {
  S.screen.query = val;
  const app = document.getElementById('app');
  const bcs = document.getElementById('breadcrumbs');
  renderSearch(app, bcs, S.screen);
}

function setSearchFilter(type, val) {
  if (type === 'grade')   S.screen.gradeFilter   = S.screen.gradeFilter   === val ? '' : val;
  if (type === 'doctype') S.screen.doctypeFilter  = S.screen.doctypeFilter === val ? '' : val;
  const app = document.getElementById('app');
  const bcs = document.getElementById('breadcrumbs');
  renderSearch(app, bcs, S.screen);
}

// ═══════════════════════════════════════════════════════════
// COMPONENT: FILE CARD
// ═══════════════════════════════════════════════════════════
function fileCard(file) {
  const title      = h(file.title || 'ללא שם');
  const docType    = file.document_type || 'unknown';
  const gradeLabel = file.grade && file.grade !== 'unknown' ? `כיתה ${file.grade}` : null;
  const catLabel   = CATEGORY_HE[file.primary_category];
  const docLabel   = DOCTYPE_HE[docType] || '';
  const typeIcon   = DOCTYPE_ICON[docType] || '📄';
  const stripBg    = DOCTYPE_STRIP[docType] || DOCTYPE_STRIP['unknown'];

  const badges = [
    gradeLabel ? `<span class="badge badge-grade">${h(gradeLabel)}</span>` : '',
    catLabel && catLabel !== 'חומרים שונים' ? `<span class="badge badge-cat">${h(catLabel)}</span>` : '',
    docLabel ? `<span class="badge badge-type">${h(docLabel)}</span>` : ''
  ].filter(Boolean).join('');

  const topics = (file.topics || [])
    .filter(t => t && t !== 'unknown')
    .map(t => `<span class="topic-tag">${h(t)}</span>`)
    .join('');

  const metaParts = [];
  if (file.year   && file.year   !== 'unknown') metaParts.push(`<span>📅 ${h(String(file.year))}</span>`);
  if (file.author && file.author !== 'unknown') metaParts.push(`<span>✍️ ${h(file.author)}</span>`);
  const meta = metaParts.join('');

  const actions = buildActions(file);

  return `<div class="file-card">
    <div class="fc-type-strip" style="background:${stripBg}"></div>
    <div class="fc-body">
      <div class="fc-header">
        <div class="fc-type-icon">${typeIcon}</div>
        <div class="fc-title">${title}</div>
      </div>
      ${badges ? `<div class="fc-badges">${badges}</div>` : ''}
      ${topics ? `<div class="fc-topics">${topics}</div>` : ''}
      ${meta   ? `<div class="fc-meta">${meta}</div>`     : ''}
    </div>
    ${actions ? `<div class="fc-actions">${actions}</div>` : ''}
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// COMPONENT: FILE ACTIONS
// ═══════════════════════════════════════════════════════════
function buildActions(file) {
  const actions = [];
  const isRepo  = file.source_type === 'repo-file' && file.path;
  const fileUrl = isRepo ? `./${file.path}` : (file.source_url || null);

  if (!fileUrl) return '';

  if (isRepo) {
    actions.push(`<button class="act-btn act-view js-viewer"
      data-fileid="${h(file.id)}" aria-label="צפייה בקובץ">
      👁 צפייה
    </button>`);
  } else {
    actions.push(`<a class="act-btn act-view" href="${ha(fileUrl)}"
      target="_blank" rel="noopener noreferrer" aria-label="פתח קישור">↗ פתח</a>`);
  }

  if (file.download_ready === true && isRepo) {
    actions.push(`<a class="act-btn act-download"
      href="${ha(fileUrl)}" download="${ha(file.file_name || 'file')}"
      aria-label="הורדת קובץ">⬇ הורדה</a>`);
  }

  if (file.print_ready === true && isRepo) {
    actions.push(`<a class="act-btn act-print"
      href="${ha(fileUrl)}" target="_blank" rel="noopener noreferrer"
      title="פתח ולחץ Ctrl+P להדפסה" aria-label="הדפסה">🖨 הדפסה</a>`);
  }

  return actions.join('');
}

function emptyState() {

  </div>`;

// ═══════════════════════════════════════════════════════════
// PDF MODAL
// ═══════════════════════════════════════════════════════════
function openViewer(fileId) {
  const file = S.index.files.find(f => f.id === fileId);
  if (!file || !file.path) return;

  const url      = `./${file.path}`;
  const modal    = document.getElementById('pdf-modal');
  const frame    = document.getElementById('pdf-frame');
  const titleEl  = document.getElementById('modal-title-text');
  const dlEl     = document.getElementById('modal-dl');
  const tabEl    = document.getElementById('modal-tab');
  const fallback = document.getElementById('pdf-fallback');
  const loading  = document.getElementById('pdf-loading');
  const fbActs   = document.getElementById('pdf-fallback-actions');

  titleEl.textContent = file.title || 'קובץ';
  dlEl.href           = url;
  dlEl.setAttribute('download', file.file_name || 'file');
  tabEl.href          = url;

  // Populate fallback action buttons
  fbActs.innerHTML = [
    `<a class="act-btn act-view" href="${ha(url)}" target="_blank" rel="noopener noreferrer">↗ פתח בכרטיסייה</a>`,
    `<a class="act-btn act-download" href="${ha(url)}" download="${ha(file.file_name||'file')}">⬇ הורדה</a>`
  ].join('');

  // Show loading, hide fallback, clear previous src
  fallback.classList.remove('visible');
  loading.classList.remove('hidden');
  frame.src = '';

  // Small delay before setting src so loading overlay is painted
  requestAnimationFrame(() => {
    frame.src = url;
  });

  let loadTimer;
  frame.onload = () => {
    // Hide loading overlay once iframe has loaded
    loading.classList.add('hidden');
    clearTimeout(loadTimer);
    // Remove hidden class after fade-out so it doesn't block clicks
    setTimeout(() => { loading.style.display = 'none'; }, 350);
  };

  // If iframe never fires onload (X-Frame-Options block), show fallback after 10s
  loadTimer = setTimeout(() => {
    if (!loading.classList.contains('hidden')) {
      loading.classList.add('hidden');
      fallback.classList.add('visible');
    }
  }, 10000);

  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const modal   = document.getElementById('pdf-modal');
  const frame   = document.getElementById('pdf-frame');
  const loading = document.getElementById('pdf-loading');
  modal.style.display = 'none';
  loading.style.display = '';
  loading.classList.remove('hidden');
  frame.src = '';
  document.body.style.overflow = '';
}

document.getElementById('pdf-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Event delegation for viewer buttons
document.getElementById('app').addEventListener('click', function(e) {
  const btn = e.target.closest('.js-viewer');
  if (btn) openViewer(btn.dataset.fileid);
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  app.innerHTML = `<div class="error-scr">
    <div class="error-icon-wrap">⚠</div>
    <div class="error-title">לא ניתן לטעון את המאגר</div>
    <div class="error-body">
      ודא שהדף מוגש משרת ולא ישירות מקובץ (file://).<br>
      לבדיקה מקומית: הרץ <code>python3 -m http.server 8080</code> ופתח <code>http://localhost:8080</code>.
      <div class="error-code">${h(detail)}</div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// ESCAPING UTILITIES
// ═══════════════════════════════════════════════════════════
function h(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function ha(str) {
  return encodeURI(String(str == null ? '' : str))
    .replace(/"/g, '%22')
    .replace(/'/g, '%27');
}
